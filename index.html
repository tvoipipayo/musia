
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>муся ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comforter&family=Manrope:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(ellipse at 50% 45%,
          #38203f 0%,
          #1b1025 40%,
          #09070e 100%);
      color: white;
      font-family: 'Manrope', sans-serif;
    }

    /* Фоновое свечение */
    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: #d45bff;
      filter: blur(130px);
      opacity: 0.23;
      border-radius: 50%;
      animation: breathe 5s ease-in-out infinite alternate;
    }

    /* Главная надпись */
    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      animation: appear 1.8s ease-out both;
    }

    h1 {
      font-family: 'Comforter', cursive;
      font-size: clamp(130px, 25vw, 280px);
      font-weight: 400;
      line-height: 1;
      padding: 0 25px 25px;

      background: linear-gradient(
        135deg,
        #ffffff 5%,
        #ffd8f4 30%,
        #f2a5ff 55%,
        #bd8bff 80%,
        #ffffff 100%
      );

      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      filter: drop-shadow(0 0 15px #d875ff80);
      animation: shimmer 6s linear infinite;
      transition: filter 0.5s, transform 0.5s;
      cursor: default;
      user-select: none;
    }

    h1:hover {
      transform: scale(1.07) rotate(-2deg);
      filter:
        drop-shadow(0 0 15px #efb4ff)
        drop-shadow(0 0 45px #bd58ff);
    }

    .subtitle {
      margin-top: -4px;
      font-size: 11px;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: #e6c8f1;
      opacity: 0;
      animation: fadeIn 1.5s ease 1s forwards;
    }

    .heart {
      display: inline-block;
      margin-top: 28px;
      color: #ffb8e8;
      font-size: 19px;
      text-shadow: 0 0 18px #ff6fd6;
      animation: heartbeat 2s ease-in-out infinite;
    }

    /* Плавающие звёздочки */
    .star {
      position: absolute;
      color: #fff0ff;
      pointer-events: none;
      animation: floatUp linear infinite;
      text-shadow: 0 0 12px #f2a5ff;
    }

    /* Кружок в углу */
    .corner {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: #b8a1c4;
      font-size: 10px;
      letter-spacing: 3px;
      opacity: 0.55;
      white-space: nowrap;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.92);
        filter: blur(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes fadeIn {
      to { opacity: 0.8; }
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    @keyframes breathe {
      from { transform: scale(0.8); opacity: 0.15; }
      to { transform: scale(1.3); opacity: 0.32; }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(20px) rotate(0deg);
        opacity: 0;
      }
      15% { opacity: 0.9; }
      85% { opacity: 0.6; }
      100% {
        transform: translateY(-110vh) rotate(180deg);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <main class="container">
    <h1>муся</h1>
    <p class="subtitle">ПОШЛА НАХУЙ</p>
    <div class="heart">♡</div>
  </main>

  <div class="corner">✧</div>

  <script>
    // Создаём парящие звёздочки
    const symbols = ['✦', '✧', '⋆', '·', '♡'];

    for (let i = 0; i < 45; i++) {
      const star = document.createElement('span');
      star.className = 'star';
      star.textContent =
        symbols[Math.floor(Math.random() * symbols.length)];

      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = (60 + Math.random() * 60) + 'vh';
      star.style.fontSize = (8 + Math.random() * 16) + 'px';
      star.style.animationDuration = (7 + Math.random() * 13) + 's';
      star.style.animationDelay = (-Math.random() * 18) + 's';

      document.body.appendChild(star);
    }

    // Небольшая реакция на нажатие
    const title = document.querySelector('h1');

    title.addEventListener('click', () => {
      title.animate([
        { transform: 'scale(1)' },
        { transform: 'scale(1.18) rotate(-4deg)' },
        { transform: 'scale(1)' }
      ], {
        duration: 500,
        easing: 'ease-out'
      });
    });
  </script>
</body>
</html>
